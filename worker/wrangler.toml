# Cloudflare Worker — DOAJ African Journals Cache
# Doc: https://developers.cloudflare.com/workers/

name            = "doaj-african-cache"
main            = "worker.js"
compatibility_date = "2024-09-23"

# KV namespace — run once to create:
#   wrangler kv:namespace create DOAJ_KV
#   wrangler kv:namespace create DOAJ_KV --preview
# Then paste the returned IDs below.
[[kv_namespaces]]
binding    = "DOAJ_KV"
id         = "e5d9b1495a6a431b8dd40f58789bc4e4"
preview_id = "b911aabc9f76452ead2f1338608949f6"

# Cron: set via Cloudflare dashboard (Workers > doaj-african-cache > Settings > Triggers)
# Schedule: 0 0 * * 0  (every Sunday at midnight UTC)

# Secret for /refresh endpoint — set with:
#   wrangler secret put REFRESH_SECRET
# (never put the actual value here)
