# Cloudflare Worker — DOAJ African Journals Cache
# Doc: https://developers.cloudflare.com/workers/

name            = "doaj-african-cache"
main            = "worker.js"
compatibility_date = "2024-09-23"

# KV namespace — run once to create:
#   wrangler kv:namespace create DOAJ_KV
#   wrangler kv:namespace create DOAJ_KV --preview
# Then paste the returned IDs below.
[[kv_namespaces]]
binding    = "DOAJ_KV"
id         = "e5d9b1495a6a431b8dd40f58789bc4e4"
preview_id = "b911aabc9f76452ead2f1338608949f6"

# Cron — déclaré ici (et non plus seulement dans le dashboard) pour qu'un
# redéploiement ne puisse pas le perdre. Les entrées KV expirent après 35 jours
# (KV_TTL dans worker.js) : le passage doit donc rester au moins mensuel.
# Après déploiement, vérifier dans Workers > doaj-african-cache > Settings > Triggers.
[triggers]
# NB : Cloudflare refuse « 0 » pour le jour de la semaine (1-7 ou MON-SUN).
# C'est l'erreur de l'ancienne consigne « 0 0 * * 0 », jamais acceptée par l'API.
crons = ["0 3 * * SUN"]   # chaque dimanche à 03:00 UTC

# Secret for /refresh endpoint — set with:
#   wrangler secret put REFRESH_SECRET
# (never put the actual value here)

# Workers AI binding — no API key needed, tied to this Cloudflare account.
# Used by the /topics endpoint to generate journal research-topic summaries.
[ai]
binding = "AI"
